name: Update MCP profile stats
on:
  schedule:
    - cron: '45 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-mcp-profile-stats.mjs
      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mcp-ecosystem-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh MCP adoption card"
            git push
          fi
